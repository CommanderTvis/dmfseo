name: daily-check
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-check
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: astral-sh/setup-uv@v5
      - name: Search ranks
        # Manual runs reuse today's results instead of spending search API quota again.
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] && grep -q "^$(date -u +%F)," site/data/results.csv; then
            echo "today's ranks already collected, skipping"
          else
            uv run scripts/collect.py site/data
          fi
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      - name: Search Console
        continue-on-error: true
        run: uv run scripts/gsc.py site/data
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      - name: Sitemap content
        continue-on-error: true
        run: python3 scripts/sitemap_urls.py site/data
      - name: Publish
        run: |
          cp dashboard/index.html site/index.html
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data $(date -u +%F)" && git push
