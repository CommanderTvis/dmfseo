name: wp-publish
on:
  push:
    branches: [main]
    paths: ["pages/**", "snippets/**", "scripts/wp_sync.py"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would change"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: wp-publish
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check PHP syntax (a broken snippet can take the site down)
        run: for f in snippets/*.php; do php -l "$f" || exit 1; done
      - uses: astral-sh/setup-uv@v10.3.3  # exact release: setup-uv has no floating major tags since v8
      - run: uv run scripts/wp_sync.py push ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      - name: Tell Google the sitemap changed
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        continue-on-error: true
        run: uv run scripts/gsc_sitemap.py
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
