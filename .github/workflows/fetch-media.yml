name: fetch-media
# Downloads the openly licensed images listed in media/fetch.json (Wikimedia Commons) as WebP and
# commits them to the same branch, so they can be reviewed in the pull request before publishing.
# Runs only on feature branches; main is published by wp-publish as usual.
on:
  push:
    branches-ignore: [main, gh-pages]
    paths: ["media/fetch.json", "scripts/fetch_media.py", ".github/workflows/fetch-media.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run scripts/fetch_media.py
      - name: Commit new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "media: fetch openly licensed images from Wikimedia Commons"
          git push
