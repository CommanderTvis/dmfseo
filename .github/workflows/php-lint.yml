name: php-lint
# Syntax check of our PHP snippets on every pull request and push to main. A snippet with a
# syntax error must never reach the site: the Code Snippets plugin runs it on every page.
on:
  push:
    branches: [main]
    paths: ["snippets/**", ".github/workflows/php-lint.yml"]
  pull_request:
    paths: ["snippets/**", ".github/workflows/php-lint.yml"]
permissions:
  contents: read
jobs:
  lint:
    # Ubuntu 24.04 ships PHP 8.3, the version the site's server (Ubuntu 24.04, Apache 2.4.58) runs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: php -l
        run: |
          php --version
          for f in snippets/*.php; do php -l "$f" || exit 1; done
